<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 10px;
        }
        .product {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .product img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--tg-theme-bg-color, #ffffff);
            padding: 20px;
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
        .categories {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            margin-bottom: 10px;
            padding-bottom: 5px;
        }
        .cat-btn {
            padding: 5px 10px;
            background: #eee;
            border-radius: 5px;
            text-decoration: none;
            color: black;
            white-space: nowrap;
        }
        .cat-btn.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .search-box {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .search-box input {
            flex-grow: 1;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .search-box button {
            width: auto;
            margin: 0;
        }

        /* Стили для блока рекомендаций в модальном окне */
        .recommendations-box {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px dashed #ccc;
        }
        .rec-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--tg-theme-button-color, #2481cc);
        }
        .rec-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.03);
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .add-rec-btn {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Поиск -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск..." value="{{ search_query }}">
        <button onclick="applyFilters()">Найти</button>
    </div>

    <!-- Категории -->
    <div class="categories">
        <a href="/?category=all" class="cat-btn {% if category == 'all' %}active{% endif %}">Все</a>
        <a href="/?category=Телефоны" class="cat-btn {% if category == 'Телефоны' %}active{% endif %}">Телефоны</a>
        <a href="/?category=Чехлы" class="cat-btn {% if category == 'Чехлы' %}active{% endif %}">Чехлы</a>
        <a href="/?category=Стекла" class="cat-btn {% if category == 'Стекла' %}active{% endif %}">Стекла</a>
    </div>

    <!-- Список товаров -->
    <div id="products-list">
        {% for p in products %}
        <div class="product">
            {% if p.Фото %}
            <img src="{{ p.Фото }}" alt="{{ p.Название }}">
            {% endif %}
            <h3>{{ p.Название }}</h3>
            <p>{{ p.Описание }}</p>
            <p><b>Цена: {{ p.Цена }} грн</b></p>
            
            {% if p.variants %}
            <select id="opt-{{ loop.index }}">
                {% for v in p.variants %}
                <option value="{{ v.price }}">{{ v.name }} - {{ v.price }} грн</option>
                {% endfor %}
            </select>
            <button onclick="addWithOptions('{{ p.Название }}', 'opt-{{ loop.index }}')">В корзину</button>
            {% else %}
            <button onclick="addToCart('{{ p.Название }}', '{{ p.Цена }}')">В корзину</button>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    <!-- Модальное окно корзины -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <h2>Корзина</h2>
            <div id="cartItemsList"></div>
            
            <!-- Блок подбора аксессуаров -->
            <div class="recommendations-box" id="recommendationsContainer" style="display: none;">
                <div class="rec-title">⚡ Рекомендуем к вашему устройству:</div>
                <div id="recItemsList"></div>
            </div>

            <div style="margin-top: 15px;">
                <input type="text" id="clientName" placeholder="Ваше имя" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box;">
                <input type="tel" id="clientPhone" placeholder="Номер телефона" style="width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box;">
                <button onclick="submitOrder()" style="background-color: #28a745;">Оформить заказ</button>
            </div>
            <button onclick="closeModal()" style="background-color: #6c757d; margin-top: 5px;">Закрыть</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        let mainButton = tg.MainButton;
        mainButton.setText("🛒 Корзина");
        
        Telegram.WebApp.onEvent('mainButtonClicked', function(){
            openCartModal();
        });

        function updateUI() {
            let totalCount = cart.length;
            if (totalCount > 0) {
                let totalPrice = cart.reduce((sum, item) => sum + Number(item.price), 0);
                mainButton.setText(`🛒 Оформить заказ (${totalCount}) • ${totalPrice} грн`);
                mainButton.show();
            } else {
                mainButton.hide();
                closeModal();
            }
            localStorage.setItem('cart', JSON.stringify(cart));
        }
        updateUI();

        function addToCart(title, price) { 
            cart.push({title, price}); 
            updateUI(); 
        }

        function addWithOptions(baseTitle, selectId) {
            let selectElement = document.getElementById(selectId);
            let selectedPrice = selectElement.value;
            let selectedText = selectElement.options[selectElement.selectedIndex].text;
            let fullTitle = `${baseTitle} (${selectedText})`;
            
            cart.push({title: fullTitle, price: selectedPrice});
            updateUI();
        }

        function addAccessory(title, price) {
            cart.push({title: title, price: price});
            updateUI();
            openCartModal(); // Обновляем модальное окно после добавления аксессуара
        }
        
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateUI();
            openCartModal();
        }

        function openCartModal() {
            if(cart.length === 0) { return; }
            let list = document.getElementById('cartItemsList');
            let totalPrice = cart.reduce((sum, item) => sum + Number(item.price), 0);
            
            list.innerHTML = cart.map((i, index) => `
                <div class="cart-item">
                    <span>${i.title} - <b>${i.price} грн</b></span>
                    <button class="delete-btn" onclick="removeFromCart(${index})">X</button>
                </div>
            `).join('') + `<div style="margin-top: 10px; font-weight: bold;">Итого: ${totalPrice} грн</div>`;
            
            let recBox = document.getElementById('recommendationsContainer');
            let recList = document.getElementById('recItemsList');

            // Берем первый товар из корзины для подбора чехлов/стекол
            let firstItem = cart[0];
            if (firstItem) {
                let words = firstItem.title.split(' ');
                let searchModel = words.slice(0, 2).join(' ').toLowerCase(); 

                fetch(`/api/accessories?model=${encodeURIComponent(searchModel)}`)
                    .then(res => res.json())
                    .then(accessories => {
                        if (accessories && accessories.length > 0) {
                            recList.innerHTML = accessories.map(acc => `
                                <div class="rec-item">
                                    <span>${acc.Название} (${acc.Цена} грн)</span>
                                    <button class="add-rec-btn" onclick="addAccessory('${acc.Название}', '${acc.Цена}')">+ В корзину</button>
                                </div>
                            `).join('');
                            recBox.style.display = 'block';
                        } else {
                            recBox.style.display = 'none';
                        }
                    }).catch(() => {
                        recBox.style.display = 'none';
                    });
            } else {
                recBox.style.display = 'none';
            }

            document.getElementById('cartModal').style.display = 'flex';
            mainButton.hide();
        }

        function closeModal() { 
            document.getElementById('cartModal').style.display = 'none'; 
            if (cart.length > 0) { mainButton.show(); }
        }

        function submitOrder() {
            let name = document.getElementById('clientName').value;
            let phone = document.getElementById('clientPhone').value;
            if(!name || !phone) { alert('Введите имя и телефон!'); return; }
            
            fetch('/order', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ items: cart, name: name, phone: phone })
            }).then(() => { 
                alert('Заказ оформлен!'); 
                localStorage.removeItem('cart'); 
                cart = []; 
                updateUI(); 
                closeModal(); 
                tg.close(); 
            });
        }

        function applyFilters() {
            let s = document.getElementById('searchInput').value;
            window.location.href = `/?category={{ category }}&search=${encodeURIComponent(s)}`;
        }
    </script>
</body>
</html>
