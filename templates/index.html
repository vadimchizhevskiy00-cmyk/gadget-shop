<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); padding: 16px; margin: 0; }
        .category-btn { background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; padding: 16px; border-radius: 12px; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .search-input, .filter-select, .form-input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; }
        .product-card { background: var(--tg-theme-secondary-bg-color); padding: 12px; border-radius: 12px; margin-bottom: 12px; }
        .buy-btn { background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; padding: 10px; border-radius: 8px; width: 100%; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 16px; box-sizing: border-box; }
        .modal-content { background: var(--tg-theme-bg-color); padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    {% if not category %}
        <h1>Каталог</h1>
        <a href="/?category=телефоны" class="category-btn" style="display:block; text-align:center; text-decoration:none;">📱 Телефоны</a>
        <a href="/?category=Чехлы" class="category-btn" style="display:block; text-align:center; text-decoration:none;">🛡️ Чехлы</a>
    {% else %}
        <button onclick="window.location.href='/'" class="category-btn" style="background:none; border:1px solid #ccc; color:inherit;">⬅ Назад</button>
        <button onclick="openCartModal()" class="category-btn">🛒 Корзина (<span id="cartCount">0</span>)</button>
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск..." value="{{ search }}" onkeypress="if(event.key==='Enter') applyFilters()">
        
        {% for p in products %}
        <div class="product-card">
            <div><strong>{{ p.Название }}</strong> — {{ p.Цена }} грн</div>
            <button class="buy-btn" onclick="addToCart('{{ p.Название }}', '{{ p.Цена }}')">В корзину</button>
        </div>
        {% endfor %}
    {% endif %}

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <h3>Ваш заказ</h3>
            <div id="cartItemsList"></div>
            <input type="text" id="clientName" class="form-input" placeholder="Имя">
            <input type="tel" id="clientPhone" class="form-input" placeholder="Телефон">
            <button class="buy-btn" onclick="submitOrder()">Подтвердить заказ</button>
            <button onclick="closeModal()" class="category-btn" style="background:none; color:gray;">Закрыть</button>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        function updateUI() { document.getElementById('cartCount').innerText = cart.length; }
        updateUI();

        function addToCart(title, price) { cart.push({title, price}); localStorage.setItem('cart', JSON.stringify(cart)); updateUI(); alert('Добавлено!'); }
        
        function openCartModal() {
            let list = document.getElementById('cartItemsList');
            list.innerHTML = cart.map(i => `<div>${i.title} - ${i.price} грн</div>`).join('');
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('cartModal').style.display = 'none'; }

        function submitOrder() {
            fetch('/order', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ items: cart, name: document.getElementById('clientName').value, phone: document.getElementById('clientPhone').value })
            }).then(() => { 
                alert('Заказ оформлен!'); localStorage.removeItem('cart'); cart=[]; updateUI(); closeModal(); window.Telegram.WebApp.close(); 
            });
        }

        function applyFilters() {
            let s = document.getElementById('searchInput').value;
            window.location.href = `/?category={{ category }}&search=${encodeURIComponent(s)}`;
        }
    </script>
</body>
</html>
